[package]
name = "auto-runs"
version = "0.1.0"
edition = "2021"
default-run = "auto-runs"
license = "0BSD"

[lib]
name = "auto_runs"
path = "src/lib.rs"

[[bin]]
name = "auto-runs"
path = "src/main.rs"

[[bin]]
name = "auto-runs-worker"
path = "src/bin/auto_runs_worker.rs"

[dependencies]
chatbot_lib = { path = "../chatbot-worker", package = "chatbot-worker" }
auto_runs_contracts = { path = "crates/auto-runs-contracts", package = "auto-runs-contracts" }
ai-providers = { path = "../ai-providers" }
tmc = { package = "the-markdown-commons", path = "../the-markdown-commons", features = ["egui"] }
eframe = "0.29.1"
egui = "0.29.1"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "6.0"
pulldown-cmark = "0.13"
egui_extras = { version = "0.29.1", features = ["syntect", "all_loaders"] }
rust-debug = { git = "https://github.com/mjgil-rust/rust-debug", rev = "9038be5", features = ["tracing-integration"] }
memmap2 = "0.9"
libc = "0.2"
zerocopy = { version = "0.8", features = ["derive"] }
fs2 = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
schemars = "1.0"
toml = "1.0"
once_cell = "1.19"
wait-timeout = "0.2"

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
incremental = true

[profile.release.package."*"]
opt-level = 3

[profile.ship]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
incremental = false

[dev-dependencies]
cap = "0.1.2"
tempfile = "3"

[profile.coverage]
inherits = "dev"
opt-level = 0
debug = 1
incremental = false
